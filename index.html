<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123d35" />
    <title>Коран: выбор суры</title>
    <style>
      /* Кораническая гарнитура: KFGQPC Uthmanic HAFS (расм ‘усмани,
         чтение Хафса). Лежит локально в font/ (KFGQPC HAFS Uthmanic Script v0.18). */
      @font-face {
        font-family: 'KFGQPC Uthmanic HAFS';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('font/UthmanicHafs1Ver18.ttf') format('truetype');
      }
      :root {
        --forest: #123d35;
        --forest-light: #1c594b;
        --gold: #d6a958;
        --cream: #f7f2e8;
        --paper: #fffdf8;
        --ink: #24332e;
        --muted: #79847d;
        --line: #e9e4d8;
        /* Основная арабская гарнитура для аятов */
        --arabic-font: 'KFGQPC Uthmanic HAFS', 'Amiri', 'Times New Roman', serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        color: var(--ink);
        background: radial-gradient(ellipse at 10% 0%, #e6d7b742, transparent 34%), var(--cream);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }
      .page {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        width: 100%;
        max-width: none;
        margin: 0;
      }
      .hero {
        position: relative;
        overflow: hidden;
        padding: 16px 18px;
        color: #fffdf8;
        background: linear-gradient(135deg, var(--forest), #0d302a);
        flex: 0 0 auto;
      }
      .hero::after {
        position: absolute;
        right: -35px;
        bottom: -90px;
        width: 180px;
        height: 180px;
        border: 1px solid #d6a95835;
        border-radius: 50%;
        box-shadow:
          0 0 0 18px #d6a9580a,
          0 0 0 38px #d6a95808;
        content: '';
        pointer-events: none;
      }
      .hero-top {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .hero h1 {
        margin: 0;
        font-size: clamp(1.2rem, 4.5vw, 1.65rem);
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        flex: 1 1 auto;
      }
      .hero .arabic-title {
        font-family: var(--arabic-font);
        font-size: clamp(1.4rem, 5vw, 2rem);
        line-height: 1.4;
        flex: 0 0 auto;
      }
      .content {
        flex: 1 1 auto;
        padding: 14px 18px 20px;
        background: var(--paper);
        border-top: 0;
      }
      .menu {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .surah-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        color: inherit;
        text-decoration: none;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease,
          transform 0.12s ease;
      }
      .surah-card:hover {
        border-color: var(--gold);
        box-shadow: 0 6px 18px #123d3512;
      }
      .surah-card:active {
        transform: scale(0.985);
      }
      .surah-num {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 12px;
        color: #f8f5ed;
        background: var(--forest);
        font-weight: 700;
        font-size: 1.05rem;
      }
      .surah-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        flex: 1 1 auto;
      }
      .surah-name {
        font-weight: 700;
        font-size: 1.02rem;
        line-height: 1.25;
      }
      .surah-meta {
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.3;
      }
      .surah-arabic {
        font-family: var(--arabic-font);
        font-size: 1.6rem;
        line-height: 1.5;
        flex: 0 0 auto;
        color: var(--forest);
      }
      .menu-note {
        margin: 14px 2px 0;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.5;
      }
      @media (max-width: 430px) {
        .content {
          padding: 12px 13px 16px;
        }
        .surah-arabic {
          font-size: 1.4rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="hero">
        <div class="hero-top">
          <h1>Коран — выбор суры</h1>
          <div class="arabic-title" lang="ar">ٱلْقُرْءَان</div>
        </div>
      </div>
      <div class="content">
        <nav class="menu" aria-label="Список сур">
          <a class="surah-card" href="fatiha.html">
            <span class="surah-num">1</span>
            <span class="surah-info">
              <span class="surah-name">аль-Фатиха</span>
              <span class="surah-meta">«Открывающая», мекканская, 7 аятов</span>
            </span>
            <span class="surah-arabic" lang="ar">ٱلْفَاتِحَة</span>
          </a>
          <a class="surah-card" href="baqara.html">
            <span class="surah-num">2</span>
            <span class="surah-info">
              <span class="surah-name">аль-Бакара</span>
              <span class="surah-meta">«Корова», мединская, 286 аятов · в разборе 1–20</span>
            </span>
            <span class="surah-arabic" lang="ar">ٱلْبَقَرَة</span>
          </a>
        </nav>
        <p class="menu-note">Список будет пополняться по мере добавления аятов в корпус проекта.</p>
      </div>
    </main>
  </body>
</html>
